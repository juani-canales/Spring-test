spring.application.name=demo

# Configuracion de mysql
spring.datasource.url=jdbc:mysql://localhost:3306/springGrupal
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ARCA / AFIP (homologación)
afip.cuit=cuit (poner propio)
afip.key-path=clavePrivada (poner propio)
afip.cert-path=certificado.pem (poner propio)
afip.tipo-comprobante=11

# Datos del emisor que se imprimen en el PDF
emisor.razon-social=Mi Empresa S.R.L.
emisor.domicilio=Av. Siempre Viva 742
emisor.condicion-iva=IVA Responsable Inscripto
